name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so prerendered scores and Open Graph cards stay current.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pages must be enabled once in Settings → Pages with source "GitHub Actions".
      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build, prerender and render Open Graph cards
        env:
          # Project site lives under /ankesi/. With a custom domain, set this to "/"
          # and VITE_SITE_ORIGIN to the domain.
          VITE_BASE: /ankesi/
          VITE_SITE_ORIGIN: https://wpfsg.github.io
          # Preinstalled on ubuntu-latest; scripts/og.mjs renders cards with it.
          CHROME_PATH: /usr/bin/google-chrome
          # Optional: add these as repository secrets to enable accounts.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
